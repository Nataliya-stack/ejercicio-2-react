<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">    
  <title>El Ahorcado</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>
<body class="bg-gradient-to-tr from-indigo-50 via-pink-50 to-slate-50 text-indigo-950 min-h-screen h-screen flex items-center justify-center p-2 sm:p-4 overflow-hidden">

  <!-- БОЛЬШАЯ ШИРОКАЯ ПОДЛОЖКА -->
  <div class="w-11/12 sm:w-full max-w-4xl h-[94vh] flex flex-col justify-between p-4 sm:p-6 bg-white/40 backdrop-blur-md rounded-[2.5rem] shadow-[0_20px_50px_rgba(165,180,252,0.2)] border border-white/60">

   <header class="w-full flex flex-col sm:flex-row items-center justify-center sm:justify-between gap-2 sm:gap-4 border-b border-indigo-100/50 pb-3 text-center">
      <h2 class="text-3xl sm:text-5xl font-normal text-transparent bg-clip-text bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 drop-shadow-[0_4px_6px_rgba(99,102,241,0.4)] tracking-wider text-center" style="font-family: 'Luckiest Guy', cursive;">
      <span class="sm:hidden">Ahorcado</span>
      <span class="hidden sm:inline">Juego del Ahorcado</span>
    </h2>

      <!-- ДВОЙНАЯ КНОПКА-БАТОН ДЛЯ ВАНИЛЬНОЙ ВЕРСИИ -->
      <div class="flex items-center bg-gradient-to-r from-indigo-500 to-purple-600 p-1 rounded-full shadow-[0_4px_15px_rgba(99,102,241,0.4)] border border-indigo-400/20 transition-all duration-150 transform hover:-translate-y-0.5" style="font-family: 'Luckiest Guy', cursive;">
  
        <!-- Левая половина: Переключение на главную React-версию (ссылка на index.html) -->
        <a href="./index.html" class="px-4 py-1.5 text-white/90 hover:text-white active:scale-95 transition-all tracking-wider text-xs sm:text-sm text-center flex items-center justify-center">
          React
        </a>

        <!-- Вертикальная разделяющая линия прямо посередине батона -->
          <div class="w-[2px] h-5 bg-white/40 rounded-full"></div>

            <!-- Правая половина: Начать игру (запуск ванильной функции empezar) -->
            <button onclick="empezar()" class="px-4 py-1.5 text-white hover:text-indigo-100 active:scale-95 transition-all tracking-wider text-xs sm:text-sm cursor-pointer">
              Jugar
            </button>

          </div>
    </header>

    <!-- ЦЕНТРАЛЬНАЯ ЧАСТЬ: слово и виселица автоматически масштабируются -->
    <main class="w-full flex-grow flex flex-col items-center justify-center gap-2 my-1">
      <div id="palabra" class="text-3xl sm:text-5xl font-normal tracking-[0.2em] uppercase text-indigo-950 my-2 select-none" style="font-family: 'Luckiest Guy', cursive;">
        <h2>Palabra</h2>
      </div>

      <div id="errores" class="flex flex-col items-center gap-3 bg-white/80 backdrop-blur-sm p-4 sm:p-6 rounded-3xl shadow-[0_15px_40px_rgba(165,180,252,0.25)] border border-indigo-50/50 scale-90 sm:scale-100">
        <!-- SVG del Ahorcado с мультяшным человечком -->
        <svg id="svg-ahorcado" width="200" height="220" viewBox="0 0 200 250" class="bg-indigo-50/50 rounded-2xl border border-indigo-100 shadow-inner">
          <line x1="10" y1="240" x2="150" y2="240" stroke="currentColor" stroke-width="8" stroke-linecap="round" class="text-amber-800/80" />
          <line x1="40" y1="240" x2="40" y2="20" stroke="currentColor" stroke-width="8" stroke-linecap="round" class="text-amber-800/80" />
          <line x1="40" y1="20" x2="120" y2="20" stroke="currentColor" stroke-width="8" stroke-linecap="round" class="text-amber-800/80" />
          <line x1="120" y1="20" x2="120" y2="50" stroke="currentColor" stroke-width="6" stroke-linecap="round" class="text-amber-700/60" />

          <g id="cabeza" class="parte-cuerpo text-indigo-400" style="display: none;">
            <circle cx="120" cy="70" r="18" stroke="currentColor" stroke-width="6" fill="white" />
            <line x1="109" y1="65" x2="115" y2="71" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
            <line x1="115" y1="65" x2="109" y2="71" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
            <line x1="125" y1="65" x2="131" y2="71" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
            <line x1="131" y1="65" x2="125" y2="71" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
          </g>
              <!-- Части тела с плавным проявлением на чистом Tailwind -->
            <line id="tronco" class="parte-cuerpo text-indigo-400 transition-opacity duration-500 ease-out" x1="120" y1="88" x2="120" y2="150" stroke="currentColor" stroke-width="8" stroke-linecap="round" style="display: none;" />
            <line id="brazo-izq" class="parte-cuerpo text-indigo-400 transition-opacity duration-500 ease-out" x1="120" y1="110" x2="90" y2="130" stroke="currentColor" stroke-width="8" stroke-linecap="round" style="display: none;" />
            <line id="brazo-der" class="parte-cuerpo text-indigo-400 transition-opacity duration-500 ease-out" x1="120" y1="110" x2="150" y2="130" stroke="currentColor" stroke-width="8" stroke-linecap="round" style="display: none;" />
            <line id="pierna-izq" class="parte-cuerpo text-indigo-400 transition-opacity duration-500 ease-out" x1="120" y1="150" x2="90" y2="190" stroke="currentColor" stroke-width="8" stroke-linecap="round" style="display: none;" />
            <line id="pierna-der" class="parte-cuerpo text-indigo-400 transition-opacity duration-500 ease-out" x1="120" y1="150" x2="150" y2="190" stroke="currentColor" stroke-width="8" stroke-linecap="round" style="display: none;" />
        </svg>
        
        <h3 id="texto-errores" class="text-base sm:text-lg font-semibold text-slate-600">
          Número de Errores: <span id="error">0</span>
        </h3>
      </div>
    </main>

    <!-- КЛАВИАТУРА: 9 колонок, идеально адаптируется по ширине экрана -->
    <footer id="teclado" class="w-full max-w-xl sm:max-w-3xl grid grid-cols-9 gap-1 sm:gap-2 mt-2 mx-auto px-1 sm:px-4 pb-2">
      <!-- Кнопки букв будут генерироваться здесь -->
    </footer>

  </div>

   <script src="./js/palabras.js"></script>
   <script src="./js/script.js"></script>
  </body>
</html>
